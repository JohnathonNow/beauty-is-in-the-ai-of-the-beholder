<!DOCTYPE html>
<head>
    <title>Beauty is in the AI of the Beholder</title>
    <script src="js/drawing.js"></script>
    <script src="js/billiards.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
</head>

<body onload="onload_drawing(); onload_billiards();">
    <div align="center">
        <h1>Beauty is in the AI of the Beholder</h1>
    </div>
    <div id="login" align="center">
        <h3 class="full">Login</h3>
        <div class="flex">
            <label class="full" for="name">Enter your name:</label> <input type="text" class="full" maxlength="24" name="FirstName" id="name" value="" placeholder="Your name" aria-label="Enter your name">
        </div>
        <button id="login-btn" style="margin-top: 10px;">Join</button>
    </div>
    <div id="lobby-selection" align="center" style="display: none;">
        <h3 class="full">Select a Lobby</h3>
        <ul id="lobby-list" style="list-style-type: none; padding: 0;"></ul>
        <button id="show-create-lobby-btn" style="margin-top: 10px;">Create Lobby</button>
        <div id="create-lobby-section" class="flex" style="display: none; margin-top: 10px; flex-direction: column; align-items: center;">
            <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; margin-bottom: 5px;">
                <input type="text" id="new-lobby-name" placeholder="New Lobby Name" maxlength="24" aria-label="New Lobby Name">
                <button id="create-lobby" style="margin-left: 10px;">Create & Join</button>
                <button id="cancel-create-lobby" style="margin-left: 10px;" title="Cancel (Esc)" aria-keyshortcuts="Escape">Cancel</button>
            </div>
            <textarea id="new-lobby-words" placeholder="Optional: Custom word list (comma-separated)" rows="3" style="width: 80%; max-width: 400px; margin-top: 5px;" aria-label="Custom word list"></textarea>
            <div style="margin-top: 5px;">
                <label for="new-lobby-mode">Game Mode:</label>
                <select id="new-lobby-mode" aria-label="Game Mode">
                    <option value="AI">AI Mode</option>
                    <option value="Classic">Classic Mode</option>
                    <option value="Evolution">Evolution Mode</option>
                    <option value="Story">Story Mode</option>
                </select>
                <label for="new-lobby-time" style="margin-left: 10px;">Time Limit (30-300s):</label>
                <input type="number" id="new-lobby-time" min="30" max="300" value="120" style="width: 120px;" aria-label="Time Limit">
            </div>
        </div>
        <button id="refresh-lobbies" style="margin-top: 10px;">Refresh</button>

        <div id="global-chat-container" style="margin-top: 20px; width: 80%; max-width: 600px; text-align: left; border: 1px solid #ccc; padding: 10px;">
            <h3>Global Chat</h3>
            <div id="global-chat-messages" style="height: 150px; overflow-y: scroll; border: 1px solid #eee; margin-bottom: 10px; padding: 5px;" role="log" aria-live="polite"></div>
            <div style="display: flex; flex-direction: row; gap: 5px;">
                <input type="text" id="global-chat-input" placeholder="Say something..." maxlength="256" style="width: 100%;" aria-label="Global Chat Input">
                <button id="global-chat-send" aria-label="Send global chat">Send</button>
            </div>
        </div>
    </div>
    <div align="center" id="game" style="display: none;">
        <meter id="timer" min="0" max="120" aria-label="Time remaining"></meter>
        <div id="gamecontainer">
            <div id="progress-container">
                <div id="player-container">
                    <h2>Players:</h2>
                    <ul class="user-list" id="user-list-1"></ul>
                </div>
                <div id="drawing-container">
                    <div id="word" role="status" aria-live="polite">
                        <br>
                    </div>
                    <div id="score" role="status" aria-live="polite">
                        <br>
                    </div>
                    <div id="drawing-workspace">
                        <div id="gallery">
                            <div id="drawing" style="position: relative;">
                                <canvas class="image" id="canvas" style="display: block;"></canvas>
                                <canvas class="image" id="ui-layer" style="display: block; position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; background: rgba(0,0,0,0);"></canvas>
                            </div>
                        </div>
                        <div id="controls">
                            <div id="colorpicker-container">
                                <p>Color:</p> <div id="colorpicker"></div>
                            </div>
                            <div id="stroke-container">
                                <p><label for="size">Stroke:</label> <span id="size-value" aria-live="polite">5</span></p> <input type="range" id="size" value="5" min="1" max="50" aria-label="Stroke Size">
                            </div>
                            <div id="tool-buttons">
                                <button id="erase" title="Eraser" aria-label="Eraser" aria-pressed="false">🧽</button>
                                <button id="pencil" title="Pencil" aria-label="Pencil" aria-pressed="false">✏️</button>
                                <button id="flood" title="Flood Fill" aria-label="Flood Fill" aria-pressed="false">🪣</button>
                                <button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo (Ctrl+Z)">↩️</button>
                                <button id="judge" title="Judge" aria-label="Judge">👨‍⚖️</button>
                                <button id="select" title="Select" aria-label="Select" aria-pressed="false">⬚</button>
                                <button id="text" title="Text" aria-label="Text Tool" aria-pressed="false">T</button>
                                <button id="shape" title="Shape" aria-label="Shape Tool" aria-pressed="false">△</button>
                            </div>
                            <div id="selection-options" style="display: none;">
                                <button id="copy-btn" title="Copy (Ctrl+C)" aria-label="Copy (Ctrl+C)">Copy</button>
                                <button id="delete-btn" title="Delete (Del)" aria-label="Delete (Del)">Delete</button>
                                <button id="paste-btn" style="display: none;" title="Paste (Ctrl+V)" aria-label="Paste (Ctrl+V)">Paste</button>
                            </div>
                            <div id="text-options" style="display: none;">
                                <input type="text" id="text-input" placeholder="Enter text" aria-label="Text Input">
                                <select id="font-select" aria-label="Font Select">
                                    <option value="Arial">Arial</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                    <option value="Georgia">Georgia</option>
                                </select>
                                <input type="number" id="text-size" value="20" min="10" max="100" aria-label="Text Size">
                            </div>
                            <div id="shape-options" style="display: none;">
                                <select id="shape-select" aria-label="Shape Select">
                                    <option value="rectangle">Rectangle</option>
                                    <option value="circle">Circle</option>
                                    <option value="triangle">Triangle</option>
                                    <option value="line">Line</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="lobby-container">
                <h2>Players:</h2>
                <ul class="user-list" id="user-list-2"></ul>
                <button id="start" style="display: none;">Start</button>
            </div>
            <div id="endgame-container">
                <h2>GG! EZ!</h2>
                <ul class="user-list" id="user-list-3"></ul>
                <button id="restart" style="display: none;">Restart</button>
            </div>
            <div id="answerscontainer">
                <div id="dummy">
                    <input type="text" name="FirstName" id="guess" value="" placeholder="Guess or chat:" maxlength="256" aria-label="Guess or chat">
                    <button id="guess-send" aria-label="Send guess or chat" style="margin: 0 0 0 5px; flex-shrink: 0; padding: 12px 18px;">Send</button>
                </div>
                <div id="answers" role="log" aria-live="polite"> </div>
            </div>
            <div id="finalgallery"></div>
        </div>

    </div>

</body>
