<!DOCTYPE html>
<html>
<head>
    <title>Bitaib Admin Console</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .section h2 { margin-top: 0; }
        input[type="text"] { width: 300px; padding: 5px; margin-bottom: 10px; }
        button { padding: 5px 15px; cursor: pointer; }
        .result { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Bitaib Admin Console</h1>

    <div class="section">
        <h2>Close Game</h2>
        <input type="text" id="closeLobby" placeholder="Lobby Name">
        <br>
        <button onclick="closeGame()">Close Game</button>
        <div id="closeResult" class="result"></div>
    </div>

    <div class="section">
        <h2>Ban User</h2>
        <input type="text" id="banLobby" placeholder="Lobby Name">
        <br>
        <input type="text" id="banUser" placeholder="Username">
        <br>
        <button onclick="banUser()">Ban User</button>
        <div id="banResult" class="result"></div>
    </div>

    <div class="section">
        <h2>Moderate Images</h2>
        <button onclick="loadImages()">Load Images</button>
        <div id="modResult" class="result"></div>
        <div id="imageGallery" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px;"></div>
    </div>

    <script>
        async function sendRequest(endpoint, body, resultElemId) {
            const resElem = document.getElementById(resultElemId);
            resElem.innerText = "Processing...";
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const text = await response.json();
                resElem.innerText = text;
            } catch (err) {
                resElem.innerText = "Error: " + err.message;
            }
        }

        function closeGame() {
            const lobby = document.getElementById("closeLobby").value;
            if (!lobby) return alert("Enter lobby name");
            sendRequest('/admin/close_game', { lobby }, 'closeResult');
        }

        function banUser() {
            const lobby = document.getElementById("banLobby").value;
            const user = document.getElementById("banUser").value;
            if (!lobby || !user) return alert("Enter lobby and user");
            sendRequest('/admin/ban_user', { lobby, user }, 'banResult');
        }

        async function loadImages() {
            const resElem = document.getElementById("modResult");
            resElem.innerText = "Loading images...";
            try {
                const response = await fetch('/admin/images');
                const images = await response.json();

                const gallery = document.getElementById("imageGallery");
                gallery.innerHTML = "";

                if (images.length === 0) {
                    resElem.innerText = "No images found.";
                    return;
                }

                resElem.innerText = `Found ${images.length} images. Click an image to delete it.`;

                for (const imgPath of images) {
                    const container = document.createElement("div");
                    container.style.border = "1px solid #ccc";
                    container.style.padding = "5px";
                    container.style.cursor = "pointer";
                    container.style.textAlign = "center";

                    const img = document.createElement("img");
                    img.src = "/" + imgPath;
                    img.style.width = "200px";
                    img.style.height = "auto";
                    img.style.display = "block";
                    img.style.marginBottom = "5px";

                    container.appendChild(img);

                    const label = document.createElement("div");
                    label.innerText = imgPath.split("/").pop();
                    label.style.fontSize = "12px";
                    label.style.wordBreak = "break-all";
                    label.style.maxWidth = "200px";
                    container.appendChild(label);

                    container.onclick = async () => {
                        if (confirm(`Are you sure you want to delete ${imgPath}?`)) {
                            container.style.opacity = "0.5";
                            await sendRequest('/admin/moderate_image', { image_path: imgPath }, 'modResult');
                            loadImages(); // Reload gallery after delete
                        }
                    };

                    gallery.appendChild(container);
                }
            } catch (err) {
                resElem.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
